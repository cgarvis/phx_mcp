name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MIX_ENV: test

jobs:
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Elixir is pinned at the ~> 1.20 floor mix.exs declares (the DSL needs
      # it; see the comment there), so OTP is what actually varies here.
      matrix:
        include:
          - elixir: "1.20.2"
            otp: "27.3"
          - elixir: "1.20.2"
            otp: "28.1"
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp${{ matrix.otp }}-elixir${{ matrix.elixir }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp${{ matrix.otp }}-elixir${{ matrix.elixir }}-mix-

      # Rules out incremental-build flakiness on a retry without paying the
      # cost on every normal run.
      - name: Clean on retry
        if: github.run_attempt != '1'
        run: mix deps.clean --all && mix clean

      - run: mix deps.get

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - run: mix test

  # Separate from `test` because it needs a database and that job deliberately
  # does not: `mix test` excludes :ecto so the default suite stays DB-free (see
  # test/test_helper.exs). Without this job MCP.OAuth.Store.Ecto would ship
  # exercised only on whichever machine last ran `mix test.ecto` by hand.
  ecto:
    name: Ecto store (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phx_mcp_test
        ports: ["5432:5432"]
        # Steps start as soon as the container does, which is well before
        # Postgres accepts connections; without this the first connect races.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.1"
          elixir-version: "1.20.2"

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-ecto-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-ecto-mix-

      - run: mix deps.get

      # test.ecto creates and migrates the database first (mix.exs alias), so
      # this needs no ecto.setup step of its own.
      - run: mix test.ecto
        env:
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_NAME: phx_mcp_test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.1"
          elixir-version: "1.20.2"

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-lint-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-lint-mix-

      - run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Check for unused deps in the lockfile
        run: mix deps.unlock --check-unused

      - name: Check for retired dependencies
        run: mix hex.audit

      # This package publishes to hexdocs, so a docs build that warns is a
      # broken reference someone will land on.
      - name: Build docs
        run: MIX_ENV=dev mix docs --warnings-as-errors
